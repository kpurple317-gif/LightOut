<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505"><title>LIGHT OUT — Events</title>
<style>
:root{--bg:#050505;--card:#101010;--text:#f5f5f5;--muted:#9b9b9b;--line:#292929}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
header{position:fixed;z-index:20;top:0;left:0;right:0;height:72px;background:#050505dd;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff14;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:2px}.brand img{width:44px;height:44px;border-radius:50%;object-fit:cover;filter:grayscale(1)}
.nav{display:flex;gap:24px;align-items:center;color:#ccc;font-size:14px}.nav a:hover{color:white}
.ticket-btn,.primary{border:0;background:#fff;color:#050505;border-radius:999px;padding:13px 20px;font-weight:900}
.secondary{background:transparent;color:white;border:1px solid #444;border-radius:999px;padding:13px 20px;font-weight:800}
.hero{min-height:100svh;display:grid;place-items:center;position:relative;padding:120px 6vw 70px;overflow:hidden;text-align:center}
.hero:before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 50% 30%,#333 0,#111 25%,#050505 62%)}
.hero-content{position:relative;max-width:900px}.kicker{font-size:12px;letter-spacing:5px;color:#aaa;font-weight:800;text-transform:uppercase}
.hero h1{font-size:clamp(72px,18vw,190px);line-height:.78;margin:28px 0 25px;font-weight:1000;letter-spacing:-9px}.hero h1 span{display:block;color:transparent;-webkit-text-stroke:1px #fff}
.hero p{color:#bbb;max-width:600px;margin:0 auto 28px;font-size:18px;line-height:1.6}.hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.scroll{position:absolute;bottom:25px;color:#777;font-size:11px;letter-spacing:3px}
section{padding:90px 6vw}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px}.section-head h2{font-size:clamp(34px,7vw,70px);margin:0;letter-spacing:-3px}.section-head p{color:#888;max-width:400px}
.events{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.event{background:linear-gradient(145deg,#151515,#0b0b0b);border:1px solid var(--line);border-radius:26px;overflow:hidden;transition:.25s}.event:hover{transform:translateY(-5px);border-color:#555}
.event-art{height:220px;display:grid;place-items:center;background:radial-gradient(circle,#292929,#0a0a0a);position:relative}.event-art .word{font-size:70px;font-weight:1000;letter-spacing:-5px;transform:rotate(-7deg)}.badge{position:absolute;top:15px;left:15px;background:#fff;color:#000;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900}
.event-body{padding:22px}.event-body h3{margin:0 0 7px;font-size:26px}.meta{color:#999;font-size:14px;line-height:1.7}.price{font-size:24px;font-weight:950;margin:18px 0}.event-body button{width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line);margin-top:70px}.stat{padding:35px 15px;text-align:center;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat b{display:block;font-size:38px}.stat span{color:#777;font-size:12px;text-transform:uppercase;letter-spacing:2px}
.about{background:#0b0b0b}.about-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:50px;align-items:center}.about h2{font-size:clamp(45px,8vw,90px);line-height:.9;letter-spacing:-5px;margin:0}.about p{color:#aaa;line-height:1.8;font-size:17px}
.logo-card{border:1px solid #333;border-radius:35px;padding:35px;display:grid;place-items:center;background:#050505}.logo-card img{width:min(100%,340px);border-radius:50%;filter:grayscale(1)}
footer{padding:45px 6vw;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:#777;font-size:13px}
.modal{position:fixed;inset:0;z-index:50;background:#000c;backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center;padding:15px}.modal.open{display:flex}
.sheet{background:#111;border:1px solid #333;border-radius:28px;max-width:560px;width:100%;padding:25px;box-shadow:0 20px 80px #000}.sheet-head{display:flex;justify-content:space-between;align-items:start}.sheet h3{font-size:30px;margin:0}.close{background:#222;color:#fff;border:1px solid #444;border-radius:50%;width:42px;height:42px}
.ticket-row{display:flex;justify-content:space-between;align-items:center;border:1px solid #333;border-radius:18px;padding:16px;margin:12px 0}.ticket-row small{color:#888;display:block;margin-top:4px}.qty{display:flex;align-items:center;gap:10px}.qty button{width:36px;height:36px;border-radius:50%;border:1px solid #444;background:#222;color:#fff}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:900;margin:20px 0}.form{display:grid;gap:10px;margin-top:18px}.form input{width:100%;background:#080808;color:#fff;border:1px solid #333;border-radius:14px;padding:14px;outline:none}.notice{font-size:12px;color:#777;line-height:1.5;margin-top:12px}
.toast{position:fixed;z-index:100;bottom:22px;left:50%;transform:translateX(-50%) translateY(100px);background:#fff;color:#000;padding:13px 18px;border-radius:999px;font-weight:800;transition:.3s;max-width:90%;text-align:center}.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:700px){.nav{display:none}.hero h1{letter-spacing:-5px}.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}.about-grid{grid-template-columns:1fr}footer{flex-direction:column}section{padding:70px 5vw}}
</style>
</head>
